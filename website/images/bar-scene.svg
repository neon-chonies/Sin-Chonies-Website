<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%"><stop offset="0%" stop-color="#1a1020"/><stop offset="100%" stop-color="#050508"/></radialGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#e63946"/><stop offset="100%" stop-color="#ffb800"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- Bar counter -->
  <rect x="0" y="280" width="800" height="40" fill="#1c1520" rx="3"/>
  <rect x="0" y="278" width="800" height="6" fill="url(#neon1)" filter="url(#glow)"/>
  <!-- Bottles on shelf -->
  <rect x="50" y="160" width="12" height="80" fill="#e63946" rx="3" opacity="0.8"/>
  <rect x="70" y="170" width="14" height="70" fill="#ffb800" rx="3" opacity="0.8"/>
  <rect x="95" y="155" width="10" height="85" fill="#e63946" rx="3" opacity="0.7"/>
  <rect x="115" y="165" width="12" height="75" fill="#8a2be2" rx="3" opacity="0.7"/>
  <rect x="135" y="175" width="14" height="65" fill="#ffb800" rx="3" opacity="0.8"/>
  <rect x="160" y="162" width="11" height="78" fill="#e63946" rx="3" opacity="0.7"/>
  <!-- Shelf line -->
  <line x1="40" y1="245" x2="180" y2="245" stroke="#252530" stroke-width="2"/>
  <!-- Neon sign -->
  <text x="400" y="100" text-anchor="middle" font-family="Impact" font-size="42" fill="url(#neon1)" filter="url(#glow)" letter-spacing="8">SIN CHONIES</text>
  <!-- Person 1 - dancing -->
  <circle cx="250" cy="370" r="18" fill="#e63946" opacity="0.7"/>
  <rect x="238" y="388" width="24" height="40" fill="#e63946" rx="5" opacity="0.7"/>
  <line x1="250" y1="370" x2="220" y2="340" stroke="#e63946" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="250" y1="370" x2="280" y2="340" stroke="#e63946" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- Person 2 -->
  <circle cx="380" cy="350" r="16" fill="#ffb800" opacity="0.7"/>
  <rect x="369" y="366" width="22" height="36" fill="#ffb800" rx="5" opacity="0.7"/>
  <line x1="380" y1="350" x2="360" y2="325" stroke="#ffb800" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="380" y1="350" x2="405" y2="330" stroke="#ffb800" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <!-- Person 3 - laughing -->
  <circle cx="530" cy="360" r="17" fill="#e63946" opacity="0.8"/>
  <rect x="518" y="377" width="24" height="38" fill="#e63946" rx="5" opacity="0.8"/>
  <path d="M520 355 Q530 345 540 355" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Person 4 -->
  <circle cx="640" cy="340" r="15" fill="#ffb800" opacity="0.7"/>
  <rect x="630" y="355" width="20" height="34" fill="#ffb800" rx="5" opacity="0.7"/>
  <line x1="640" y1="340" x2="620" y2="320" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="640" y1="340" x2="660" y2="315" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Drinks on bar -->
  <rect x="300" y="260" width="10" height="20" fill="#e63946" rx="2" opacity="0.6"/>
  <rect x="350" y="255" width="12" height="25" fill="#ffb800" rx="2" opacity="0.6"/>
  <rect x="500" y="265" width="10" height="15" fill="#e63946" rx="2" opacity="0.6"/>
  <rect x="580" y="258" width="11" height="22" fill="#ffb800" rx="2" opacity="0.6"/>
</svg>
