<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="60%"><stop offset="0%" stop-color="#200a10"/><stop offset="100%" stop-color="#050508"/></radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Stage -->
  <rect x="100" y="180" width="600" height="12" fill="#e63946" filter="url(#glow2)"/>
  <rect x="100" y="192" width="600" height="8" fill="#1c1520"/>
  <!-- Spotlight beams -->
  <polygon points="300,190 200,0 250,0" fill="#e63946" opacity="0.08"/>
  <polygon points="400,190 360,0 440,0" fill="#ffb800" opacity="0.06"/>
  <polygon points="500,190 500,0 600,0" fill="#e63946" opacity="0.08"/>
  <!-- Band members on stage -->
  <circle cx="300" cy="160" r="14" fill="#e63946" opacity="0.8"/>
  <rect x="288" y="174" width="24" height="14" fill="#e63946" rx="3" opacity="0.8"/>
  <circle cx="400" cy="155" r="15" fill="#ffb800" opacity="0.8"/>
  <rect x="387" y="170" width="26" height="16" fill="#ffb800" rx="3" opacity="0.8"/>
  <circle cx="500" cy="160" r="14" fill="#e63946" opacity="0.8"/>
  <rect x="488" y="174" width="24" height="14" fill="#e63946" rx="3" opacity="0.8"/>
  <!-- Instruments -->
  <ellipse cx="315" cy="172" rx="15" ry="8" fill="#8a2be2" opacity="0.6"/>
  <ellipse cx="400" cy="168" rx="6" ry="12" fill="#ffb800" opacity="0.6"/>
  <!-- Crowd row 1 (front) -->
  <circle cx="150" cy="330" r="16" fill="#e63946" opacity="0.5"/>
  <circle cx="200" cy="320" r="14" fill="#ffb800" opacity="0.6"/>
  <circle cx="260" cy="315" r="15" fill="#e63946" opacity="0.5"/>
  <circle cx="340" cy="310" r="17" fill="#ffb800" opacity="0.6"/>
  <circle cx="420" cy="308" r="15" fill="#e63946" opacity="0.5"/>
  <circle cx="490" cy="312" r="14" fill="#ffb800" opacity="0.6"/>
  <circle cx="550" cy="318" r="16" fill="#e63946" opacity="0.5"/>
  <circle cx="620" cy="325" r="15" fill="#ffb800" opacity="0.6"/>
  <circle cx="690" cy="335" r="13" fill="#e63946" opacity="0.5"/>
  <!-- Raised hands -->
  <line x1="150" y1="315" x2="140" y2="280" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="305" x2="195" y2="270" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="340" y1="293" x2="330" y2="260" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="420" y1="293" x2="430" y2="260" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="490" y1="298" x2="500" y2="265" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="620" y1="310" x2="630" y2="280" stroke="#ffb800" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Crowd row 2 (back) -->
  <circle cx="230" cy="380" r="13" fill="#e63946" opacity="0.3"/>
  <circle cx="310" cy="375" r="12" fill="#ffb800" opacity="0.3"/>
  <circle cx="400" cy="370" r="14" fill="#e63946" opacity="0.3"/>
  <circle cx="480" cy="372" r="12" fill="#ffb800" opacity="0.3"/>
  <circle cx="560" cy="378" r="13" fill="#e63946" opacity="0.3"/>
  <!-- Stage lights -->
  <circle cx="250" cy="50" r="25" fill="#e63946" opacity="0.15" filter="url(#bigGlow)"/>
  <circle cx="400" cy="40" r="30" fill="#ffb800" opacity="0.12" filter="url(#bigGlow)"/>
  <circle cx="550" cy="50" r="25" fill="#e63946" opacity="0.15" filter="url(#bigGlow)"/>
  <!-- Band name on kick drum -->
  <text x="400" y="250" text-anchor="middle" font-family="Impact" font-size="24" fill="#e63946" opacity="0.9" filter="url(#glow2)" letter-spacing="4">SIN CHONIES</text>
</svg>
